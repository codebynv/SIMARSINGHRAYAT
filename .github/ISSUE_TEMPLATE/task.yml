name: Task proposal
description: Propose a scoped project task
title: "[Task]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How will completion be verified?
    validations:
      required: true
